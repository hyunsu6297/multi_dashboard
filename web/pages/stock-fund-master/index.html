<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주식 펀드 마스터</title>
  <style>
    :root {
      --ink: #172026;
      --muted: #65717d;
      --line: #d9e1e8;
      --panel: #ffffff;
      --wash: #f4f7f8;
      --soft: #eaf5f2;
      --accent: #0f766e;
      --danger: #b42318;
      --warning: #9a6700;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--wash);
      color: var(--ink);
      font-family: "Segoe UI", "Malgun Gothic", Arial, sans-serif;
      font-size: 13px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px 12px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 21px;
      letter-spacing: 0;
    }

    .subtitle,
    .status-text {
      color: var(--muted);
      font-size: 12px;
    }

    .header-actions,
    .toolbar,
    .left-tools,
    .right-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    main {
      padding: 14px 18px 22px;
    }

    .panel {
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(15, 23, 42, .04);
    }

    .toolbar {
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
    }

    button,
    input {
      height: 31px;
      border: 1px solid #c8d1dc;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 12px;
    }

    input {
      width: 220px;
      padding: 0 9px;
    }

    button {
      padding: 0 10px;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover { border-color: #82909f; }
    button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    button.danger { border-color: #efc1bc; color: var(--danger); }
    button:disabled { cursor: default; opacity: .48; }

    .badge {
      display: inline-flex;
      align-items: center;
      height: 25px;
      padding: 0 8px;
      border-radius: 5px;
      background: var(--soft);
      color: #0b615a;
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .table-wrap {
      min-height: 480px;
      max-height: calc(100vh - 190px);
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      table-layout: fixed;
      font-size: 12px;
    }

    th,
    td {
      height: 32px;
      padding: 6px 8px;
      border-right: 1px solid #edf1f4;
      border-bottom: 1px solid #edf1f4;
      vertical-align: middle;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #eaf3f0;
      color: #23323d;
      font-weight: 850;
      text-align: center;
    }

    td { text-align: center; }
    td.name-cell { text-align: left; }

    td[contenteditable="true"] {
      outline: none;
      cursor: text;
    }

    td[contenteditable="true"]:focus {
      background: #f3fffc;
      box-shadow: inset 0 0 0 2px var(--accent);
    }

    tr.dirty td {
      background: #fff9e8;
    }

    .select-col {
      width: 44px;
      text-align: center;
      background: #f8fafb;
    }

    .select-col input {
      width: 16px;
      min-width: 0;
      height: 16px;
      padding: 0;
    }

    .status-col { width: 78px; }
    .code-col { width: 170px; }
    .type-col { width: 120px; }
    .name-col { width: 360px; }

    .state-button {
      width: 52px;
      height: 24px;
      padding: 0;
      border-radius: 999px;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
    }

    .state-button.active { border-color: #07856f; background: #07856f; }
    .state-button.inactive { border-color: #d92d20; background: #d92d20; }

    .status {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 12px;
      border-top: 1px solid var(--line);
      background: #fbfcfd;
    }

    .warn { color: var(--warning); }
    .error { color: var(--danger); }

    @media (max-width: 840px) {
      header {
        align-items: stretch;
        flex-direction: column;
        padding: 14px 12px 10px;
      }

      main { padding: 10px; }
      input { width: 100%; }
      .toolbar { align-items: stretch; }
      .left-tools,
      .right-tools { width: 100%; }
      .right-tools button { flex: 1; }
      .table-wrap { max-height: calc(100vh - 260px); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>주식 펀드 마스터</h1>
      <div class="subtitle">Supabase의 주식 펀드 정보 테이블을 조회하고 수정합니다.</div>
    </div>
    <div class="header-actions">
      <span class="badge" id="sourceBadge">세션 확인 중</span>
      <span class="status-text" id="userStatus">로그인 세션을 확인하고 있습니다.</span>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="toolbar">
        <div class="left-tools">
          <input id="searchInput" type="search" placeholder="펀드명/펀드코드/유형 검색" aria-label="펀드 마스터 검색">
          <button id="reloadButton" type="button">DB 다시 불러오기</button>
          <button id="downloadButton" type="button">CSV 다운로드</button>
        </div>
        <div class="right-tools">
          <button id="addButton" type="button">행 추가</button>
          <button id="deleteButton" type="button" class="danger">행삭제</button>
          <button id="saveButton" type="button" class="primary">변경 저장</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="select-col"><input id="selectAll" type="checkbox" aria-label="전체 선택"></th>
              <th class="status-col">상태</th>
              <th class="code-col">펀드코드</th>
              <th class="type-col">유형</th>
              <th class="name-col">펀드명(약식)</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="status">
        <span id="statusText">데이터를 불러오는 중입니다.</span>
        <span id="countText" class="status-text"></span>
      </div>
    </section>
  </main>

  <script type="module">
    const SUPABASE_URL = "https://esqakvzvchcunhzjlyry.supabase.co";
    const SUPABASE_KEY = "sb_publishable_T0q_8mB9yzcitTL7HH0SuA_W4DUcVtP";
    const DOMAIN = "stock";
    const FILE_KEY = "fund_info";
    const FILE_LABEL = "펀드 정보.xlsx";
    const SHEET_NAME = "Sheet1";
    const COLUMNS = ["상태", "펀드코드", "유형", "펀드명(약식)"];
    const NUMBER_COLUMNS = new Set();

    let supabase = null;
    let currentUser = null;
    let rows = [];
    let selectedRows = new Set();
    let dirtyRows = new Set();
    let rewriteAllRows = false;

    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    function setStatus(message, kind = "") {
      $("statusText").className = kind;
      $("statusText").textContent = message;
    }

    function normalizeCode(value) {
      return String(value ?? "").trim();
    }

    function normalizeNumber(value) {
      const text = String(value ?? "").replaceAll(",", "").trim();
      if (!text) return "";
      const number = Number(text);
      return Number.isFinite(number) ? number : value;
    }

    function normalizePayload(payload) {
      return {
        "상태": ["활성", "비활성"].includes(String(payload["상태"] ?? "").trim()) ? String(payload["상태"]).trim() : "활성",
        "펀드코드": normalizeCode(payload["펀드코드"]),
        "유형": String(payload["유형"] ?? "").trim(),
        "펀드명(약식)": String(payload["펀드명(약식)"] ?? payload["펀드명"] ?? "").trim()
      };
    }

    function displayValue(column, value) {
      if (!NUMBER_COLUMNS.has(column)) return value ?? "";
      const number = normalizeNumber(value);
      if (number === "" || !Number.isFinite(Number(number))) return value ?? "";
      return Number(number).toLocaleString("ko-KR", { maximumFractionDigits: 12 });
    }

    async function getSupabase() {
      if (supabase) return supabase;
      if (window.parent !== window && window.parent.dashboardSupabase) {
        supabase = window.parent.dashboardSupabase;
        return supabase;
      }
      const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
      supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true }
      });
      return supabase;
    }

    async function checkSession() {
      const client = await getSupabase();
      const { data, error } = await client.auth.getSession();
      if (error) throw error;
      currentUser = data.session?.user ?? null;
      if (!currentUser) {
        $("sourceBadge").textContent = "로그인 필요";
        $("userStatus").textContent = "메인 화면에서 로그인한 뒤 다시 열어주세요.";
        setStatus("로그인 세션이 없어 DB 데이터를 불러올 수 없습니다.", "warn");
        updateButtons();
        return false;
      }
      const { data: profile, error: profileError } = await client.from("user_profiles")
        .select("email,username,role,status,must_change_password")
        .eq("user_id", currentUser.id)
        .maybeSingle();
      if (profileError) throw profileError;
      if (!profile || profile.status !== "approved" || profile.must_change_password) {
        $("sourceBadge").textContent = "권한 확인 필요";
        $("userStatus").textContent = profile?.email || currentUser.email || "";
        setStatus("승인된 계정만 펀드 마스터를 수정할 수 있습니다.", "warn");
        updateButtons();
        return false;
      }
      $("sourceBadge").textContent = "Supabase DB";
      $("userStatus").textContent = `${profile.email || currentUser.email} · ${profile.role}`;
      return true;
    }

    async function loadRows() {
      if (!(await checkSession())) {
        rows = [];
        render();
        return;
      }
      const client = await getSupabase();
      setStatus("Supabase에서 펀드 마스터를 불러오는 중입니다.");
      const loaded = [];
      for (let start = 0; ; start += 1000) {
        const { data, error } = await client.from("manual_file_rows")
          .select("row_no,payload")
          .eq("domain", DOMAIN)
          .eq("file_key", FILE_KEY)
          .eq("sheet_name", SHEET_NAME)
          .order("row_no")
          .range(start, start + 999);
        if (error) throw error;
        loaded.push(...data);
        if (data.length < 1000) break;
      }
      rows = loaded.map((row) => ({
        row_no: row.row_no,
        payload: normalizePayload(row.payload)
      }));
      selectedRows.clear();
      dirtyRows.clear();
      rewriteAllRows = false;
      render();
      setStatus(`펀드 마스터 ${rows.length.toLocaleString()}건을 불러왔습니다.`);
    }

    function filteredRows() {
      const keyword = $("searchInput").value.trim().toLowerCase();
      if (!keyword) return rows;
      return rows.filter((row) => COLUMNS.some((column) =>
        String(row.payload[column] ?? "").toLowerCase().includes(keyword)
      ));
    }

    function render() {
      const visible = filteredRows().slice().sort((a, b) => {
        const statusOrder = (a.payload["상태"] === "비활성" ? 1 : 0) - (b.payload["상태"] === "비활성" ? 1 : 0);
        if (statusOrder !== 0) return statusOrder;
        return Number(a.row_no || 0) - Number(b.row_no || 0);
      });
      $("tableBody").innerHTML = visible.map((row) => {
        const checked = selectedRows.has(row.row_no) ? "checked" : "";
        const dirtyClass = dirtyRows.has(row.row_no) ? " class=\"dirty\"" : "";
        const stateClass = row.payload["상태"] === "비활성" ? "inactive" : "active";
        return `<tr data-row-no="${row.row_no}"${dirtyClass}>
          <td class="select-col"><input class="row-selector" type="checkbox" ${checked} aria-label="행 선택"></td>
          <td><button type="button" class="state-button ${stateClass}" data-state-row="${row.row_no}">${escapeHtml(row.payload["상태"])}</button></td>
          ${COLUMNS.map((column) => {
            if (column === "상태") return "";
            const nameClass = column === "펀드명(약식)" ? " class=\"name-cell\"" : "";
            return `<td${nameClass} contenteditable="${currentUser ? "true" : "false"}" data-column="${escapeHtml(column)}" title="${escapeHtml(displayValue(column, row.payload[column]))}">${escapeHtml(displayValue(column, row.payload[column]))}</td>`;
          }).join("")}
        </tr>`;
      }).join("");

      $("tableBody").querySelectorAll(".row-selector").forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
          const rowNo = Number(checkbox.closest("tr").dataset.rowNo);
          if (checkbox.checked) selectedRows.add(rowNo);
          else selectedRows.delete(rowNo);
          updateButtons();
        });
      });

      $("tableBody").querySelectorAll("[data-state-row]").forEach((button) => {
        button.addEventListener("click", () => {
          const rowNo = Number(button.dataset.stateRow);
          const row = rows.find((item) => item.row_no === rowNo);
          if (!row) return;
          row.payload["상태"] = row.payload["상태"] === "비활성" ? "활성" : "비활성";
          dirtyRows.add(rowNo);
          render();
          setStatus("상태를 변경했습니다. 변경 저장을 눌러 Supabase에 반영하세요.", "warn");
        });
      });

      $("tableBody").querySelectorAll("td[contenteditable='true']").forEach((cell) => {
        cell.addEventListener("input", () => {
          const rowNo = Number(cell.parentElement.dataset.rowNo);
          const row = rows.find((item) => item.row_no === rowNo);
          row.payload[cell.dataset.column] = cell.textContent.trim();
          dirtyRows.add(rowNo);
          cell.parentElement.classList.add("dirty");
          updateButtons();
        });
        cell.addEventListener("blur", () => {
          const rowNo = Number(cell.parentElement.dataset.rowNo);
          const row = rows.find((item) => item.row_no === rowNo);
          row.payload = normalizePayload(row.payload);
          cell.textContent = displayValue(cell.dataset.column, row.payload[cell.dataset.column]);
          cell.title = cell.textContent;
        });
      });

      const visibleRows = filteredRows();
      $("selectAll").checked = visibleRows.length > 0 && visibleRows.every((row) => selectedRows.has(row.row_no));
      const activeCount = rows.filter((row) => row.payload["상태"] !== "비활성").length;
      $("countText").textContent = `표시 ${visible.length.toLocaleString()}건 / 활성 ${activeCount.toLocaleString()}건 · 전체 ${rows.length.toLocaleString()}건`;
      updateButtons();
    }

    function updateButtons() {
      const canEdit = Boolean(currentUser);
      $("reloadButton").disabled = false;
      $("downloadButton").disabled = rows.length === 0;
      $("addButton").disabled = !canEdit;
      $("deleteButton").disabled = !canEdit || selectedRows.size === 0;
      $("saveButton").disabled = !canEdit || (!rewriteAllRows && dirtyRows.size === 0);
    }

    function renumberRows() {
      rows.forEach((row, index) => {
        row.row_no = index + 1;
        row.payload = normalizePayload(row.payload);
      });
      dirtyRows = new Set(rows.map((row) => row.row_no));
      rewriteAllRows = true;
    }

    async function saveRows() {
      if (!currentUser) return;
      const client = await getSupabase();
      setStatus("변경 내용을 Supabase에 저장하는 중입니다.");
      const changed = rows
        .filter((row) => rewriteAllRows || dirtyRows.has(row.row_no))
        .map((row) => ({
          domain: DOMAIN,
          file_key: FILE_KEY,
          file_label: FILE_LABEL,
          sheet_name: SHEET_NAME,
          row_no: row.row_no,
          payload: normalizePayload(row.payload),
          created_by: currentUser.id,
          updated_at: new Date().toISOString()
        }));

      for (let start = 0; start < changed.length; start += 500) {
        const { error } = await client.from("manual_file_rows")
          .upsert(changed.slice(start, start + 500), { onConflict: "domain,file_key,sheet_name,row_no" });
        if (error) throw error;
      }

      if (rewriteAllRows) {
        const { error } = await client.from("manual_file_rows").delete()
          .eq("domain", DOMAIN)
          .eq("file_key", FILE_KEY)
          .eq("sheet_name", SHEET_NAME)
          .gt("row_no", rows.length);
        if (error) throw error;
      }

      dirtyRows.clear();
      selectedRows.clear();
      rewriteAllRows = false;
      await loadRows();
      setStatus("Supabase 저장을 완료했습니다.");
    }

    function downloadCsv() {
      const lines = [COLUMNS.join(",")];
      for (const row of filteredRows()) {
        lines.push(COLUMNS.map((column) => {
          const text = String(row.payload[column] ?? "").replaceAll('"', '""');
          return `"${text}"`;
        }).join(","));
      }
      const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = "stock_fund_master.csv";
      anchor.click();
      URL.revokeObjectURL(url);
    }

    $("searchInput").addEventListener("input", render);
    $("reloadButton").addEventListener("click", () => loadRows().catch((error) => setStatus(`DB 조회 실패: ${error.message}`, "error")));
    $("downloadButton").addEventListener("click", downloadCsv);
    $("addButton").addEventListener("click", () => {
      const selectedRowNos = [...selectedRows].sort((a, b) => a - b);
      const insertAfter = selectedRowNos.at(-1);
      const insertIndex = insertAfter ? Math.max(0, rows.findIndex((row) => row.row_no === insertAfter) + 1) : rows.length;
      rows.splice(insertIndex, 0, { row_no: insertIndex + 1, payload: normalizePayload({}) });
      renumberRows();
      selectedRows.clear();
      render();
      setStatus(insertAfter ? "선택한 행 아래에 새 행을 추가했습니다. 변경 저장을 눌러 Supabase에 반영하세요." : "마지막에 새 행을 추가했습니다. 변경 저장을 눌러 Supabase에 반영하세요.", "warn");
    });
    $("deleteButton").addEventListener("click", () => {
      rows = rows.filter((row) => !selectedRows.has(row.row_no));
      selectedRows.clear();
      renumberRows();
      render();
      setStatus("선택 행을 삭제 표시했습니다. 변경 저장을 눌러 Supabase에 반영하세요.", "warn");
    });
    $("saveButton").addEventListener("click", () => saveRows().catch((error) => setStatus(`Supabase 저장 실패: ${error.message}`, "error")));
    $("selectAll").addEventListener("change", () => {
      for (const row of filteredRows()) {
        if ($("selectAll").checked) selectedRows.add(row.row_no);
        else selectedRows.delete(row.row_no);
      }
      render();
    });

    loadRows().catch((error) => setStatus(`초기화 실패: ${error.message}`, "error"));
  </script>
</body>
</html>
