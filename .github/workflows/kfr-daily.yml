name: Daily data and dashboard deployment

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "apps/**"
      - "scripts/**"
      - "automation/kfr/**"
      - "functions/**"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - ".github/workflows/kfr-daily.yml"
  workflow_dispatch:
    inputs:
      refresh_sources:
        description: Download KFR data and upload it to Supabase before building
        required: false
        default: true
        type: boolean
      business_date:
        description: Business date (YYYY-MM-DD). Leave empty for previous weekday.
        required: false
        type: string
  schedule:
    # GitHub cron is UTC: 07:30, 10:00 and 14:00 KST, Monday-Friday.
    - cron: "30 22 * * 0-4"
    - cron: "0 1 * * 1-5"
    - cron: "0 5 * * 1-5"

permissions:
  contents: read

concurrency:
  group: kfr-daily-source-import
  cancel-in-progress: true

jobs:
  download-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KFR_APP_KEY_ID: ${{ secrets.KFR_APP_KEY_ID }}
      KFR_APP_KEY_SECRET: ${{ secrets.KFR_APP_KEY_SECRET }}
      KFR_API_FALLBACK_IP: 211.62.79.16
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KIWOOM_APPKEY: ${{ secrets.KIWOOM_APPKEY }}
      KIWOOM_SECRETKEY: ${{ secrets.KIWOOM_SECRETKEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: esqakvzvchcunhzjlyry
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/kfr/requirements.txt

      - name: Install Python dependencies
        run: pip install -r automation/kfr/requirements.txt

      - name: Resolve KFR business date
        id: kfr_date
        shell: bash
        run: |
          requested_date="${{ github.event.inputs.business_date }}"
          if [[ -n "$requested_date" ]]; then
            business_date="$requested_date"
          else
            business_date="$(python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          day = datetime.now(ZoneInfo("Asia/Seoul")).date() - timedelta(days=1)
          while day.weekday() >= 5:
              day -= timedelta(days=1)
          print(day.isoformat())
          PY
          )"
          fi
          echo "business_date=${business_date}" >> "$GITHUB_OUTPUT"
          echo "KFR business date: ${business_date}"

      - name: Check whether the KFR API snapshot is already valid
        id: kfr_snapshot
        if: github.event_name == 'schedule'
        continue-on-error: true
        shell: bash
        run: |
          args=(--check-existing --business-date "${{ steps.kfr_date.outputs.business_date }}")
          python automation/kfr/supabase_upload.py "${args[@]}"

      - name: Download KFR Partner API JSON
        if: (github.event_name == 'schedule' && steps.kfr_snapshot.outcome == 'failure') || inputs.refresh_sources == true
        shell: bash
        run: |
          kfr_host="apiservice.kfr.co.kr"
          if kfr_ip="$(getent ahostsv4 "$kfr_host" 2>/dev/null | awk 'NR == 1 { print $1 }')" \
            && [[ "$kfr_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "KFR endpoint resolved to $kfr_ip"
          else
            kfr_ip="$KFR_API_FALLBACK_IP"
            echo "KFR DNS lookup failed; using verified endpoint IP $kfr_ip"
          fi
          echo "$kfr_ip $kfr_host" | sudo tee -a /etc/hosts >/dev/null
          getent ahostsv4 "$kfr_host"
          args=(--output-dir "$RUNNER_TEMP/kfr" --date "${{ steps.kfr_date.outputs.business_date }}")
          python automation/kfr/kfr_partner_api_download.py "${args[@]}"

      - name: Upload rows to Supabase
        if: (github.event_name == 'schedule' && steps.kfr_snapshot.outcome == 'failure') || inputs.refresh_sources == true
        shell: bash
        run: |
          args=(--input-dir "$RUNNER_TEMP/kfr" --business-date "${{ steps.kfr_date.outputs.business_date }}")
          python automation/kfr/supabase_upload.py "${args[@]}"

      - name: Download and upload stock benchmark weights
        id: stock_benchmarks
        continue-on-error: true
        run: >-
          python automation/kfr/stock_benchmark_upload.py
          --business-date "${{ steps.kfr_date.outputs.business_date }}"
          --output apps/stock/benchmark_weights.json

      - name: Warn when stock benchmark refresh is unavailable
        if: steps.stock_benchmarks.outcome == 'failure'
        run: echo "Stock benchmark refresh failed; the latest valid cache or direct download fallback will be used."

      - name: Restore KFR API JSON and manual dashboard inputs from Supabase
        run: python scripts/restore_dashboard_inputs.py

      - name: Refresh Kiwoom quotes when available
        id: kiwoom_quotes
        continue-on-error: true
        run: python apps/stock/fetch_kiwoom_quotes.py --once

      - name: Warn when Kiwoom blocks the hosted runner
        if: steps.kiwoom_quotes.outcome == 'failure'
        run: echo "Kiwoom quote refresh was blocked; building with the latest Supabase source data."

      - name: Update mezzanine delta history
        id: mezzanine_delta
        continue-on-error: true
        run: python apps/mezzanine/update_delta_history.py --history-days 30 --request-delay 0.7

      - name: Warn when mezzanine delta refresh is unavailable
        if: steps.mezzanine_delta.outcome == 'failure'
        run: echo "Mezzanine delta refresh was unavailable; the last valid delta history will be used."

      - name: Build stock dashboard
        env:
          DASHBOARD_BENCHMARK_DATE: ${{ steps.kfr_date.outputs.business_date }}
        run: python apps/stock/build_fund_dashboard.py --source json --start 2026-08-01 --static-data-bundle --recent-snapshots 1

      - name: Export stock fund return series
        run: python apps/stock/export_fund_return_series.py --output apps/stock/fund_return_series.json

      - name: Set up Supabase CLI
        if: env.SUPABASE_ACCESS_TOKEN != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy performance AI functions
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase functions deploy stock-performance-analysis --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy mezzanine-performance-analysis --project-ref "$SUPABASE_PROJECT_ID"

      - name: Build bond dashboard
        run: python apps/bond/build_dashboard.py

      - name: Build mezzanine dashboard
        run: python apps/mezzanine/build_mezzanine_dashboard.py

      - name: Build global dashboard
        run: python apps/global/build_global_dashboard.py

      - name: Assemble Cloudflare Pages site
        run: python scripts/assemble_site.py

      - name: Include fund and active ETF dashboards
        run: python scripts/fetch_external_dashboards.py

      - name: Upload dashboard build artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-dashboard-site
          path: dist
          retention-days: 7

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=multi-dashboard --branch=main


